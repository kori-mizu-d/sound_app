<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOUND TIMER</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172033;
      background: #f2f5fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 520px);
      padding: 40px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e9f2;
      border-radius: 24px;
      box-shadow: 0 18px 50px #25365a14;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #5266d6;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 { margin: 0; font-size: clamp(1.7rem, 6vw, 2.2rem); }

    .description {
      margin: 14px 0 30px;
      color: #667085;
      line-height: 1.7;
    }

    .result {
      margin: 0 0 26px;
      padding: 24px 12px;
      border-radius: 16px;
      background: #f6f7ff;
    }

    .result-label { margin: 0 0 6px; color: #667085; }

    #time {
      margin: 0;
      color: #3949ab;
      font-size: clamp(2.6rem, 12vw, 4rem);
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      line-height: 1.15;
    }

    .mic-controls {
      display: grid;
      gap: 12px;
      margin: 0 0 22px;
      text-align: left;
    }

    .sensitivity-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #475467;
      font-size: 0.9rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #4b5bdc;
    }

    .meter {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #e9ecf5;
    }

    #meter-level {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #4b5bdc;
      transition: width 80ms linear;
    }

    .mic-note {
      margin: 0;
      color: #667085;
      font-size: 0.82rem;
      line-height: 1.6;
    }

    #status {
      min-height: 1.6em;
      margin: 0 0 20px;
      color: #475467;
    }

    button {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 12px;
      background: #4b5bdc;
      color: #fff;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover:not(:disabled) { background: #3c4bc3; }
    button:active:not(:disabled) { transform: scale(0.99); }
    button:disabled { cursor: wait; opacity: 0.7; }

    .start-button { margin-top: 10px; }

    .note { margin: 18px 0 0; color: #98a2b3; font-size: 0.82rem; }

    @media (max-width: 480px) {
      main { padding: 30px 22px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>SOUND TIMER</h1>
    <p class="description">外部の音が鳴るまでの時間を計測します。マイクを接続してからスタートしてください。</p>
    <section class="result" aria-live="polite">
      <p class="result-label">スタートから音を検知するまで</p>
      <p id="time">--.--<span style="font-size: 1rem"> 秒</span></p>
    </section>
    <div class="mic-controls">
      <label class="sensitivity-label" for="sensitivity">
        <span>検出感度（右に動かすと小さな音に反応）</span>
        <output id="sensitivity-value" for="sensitivity">60</output>
      </label>
      <input id="sensitivity" type="range" min="1" max="100" value="60" aria-label="音の検出感度">
      <div class="meter" role="progressbar" aria-label="マイク入力レベル" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="meter-level"></div>
      </div>
      <p class="mic-note">周囲の音が大きいときは感度を下げてください。接続後の音声は録音されません。</p>
    </div>
    <p id="status" role="status">最初にマイクを接続してください。</p>
    <button id="connect" type="button">マイクを接続</button>
    <button id="start" class="start-button" type="button" disabled>スタート</button>
  </main>
  <script>
    const connectButton = document.querySelector("#connect");
    const startButton = document.querySelector("#start");
    const timeDisplay = document.querySelector("#time");
    const statusDisplay = document.querySelector("#status");
    const sensitivityInput = document.querySelector("#sensitivity");
    const sensitivityValue = document.querySelector("#sensitivity-value");
    const meter = document.querySelector(".meter");
    const meterLevel = document.querySelector("#meter-level");
    let audioContext;
    let analyser;
    let microphoneStream;
    let measuring = false;
    let startedAt = 0;
    let ambientLevel = 0;
    let animationFrameId;
    const samples = new Float32Array(512);

    function detectionThreshold() {
      const sensitivity = Number(sensitivityInput.value) / 100;
      return 0.003 + (1 - sensitivity) ** 2 * 0.12;
    }

    function showMicrophoneError(error) {
      if (error.name === "NotAllowedError" || error.name === "SecurityError") {
        return "マイクが許可されていません。ブラウザーのサイト設定でマイクを許可してください。";
      }
      if (error.name === "NotFoundError" || error.name === "DevicesNotFoundError") {
        return "マイクが見つかりません。マイクを接続してから、もう一度お試しください。";
      }
      if (error.name === "NotReadableError" || error.name === "TrackStartError") {
        return "マイクを使用できません。他のアプリで使用中でないか確認してください。";
      }
      return `マイクに接続できませんでした: ${error.message || error.name}`;
    }

    async function connectMicrophone() {
      connectButton.disabled = true;
      statusDisplay.textContent = "マイクの許可を確認しています…";
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("この接続ではマイクを利用できません。HTTPSまたはlocalhostで開いてください。");
        }

        audioContext = new AudioContext();
        await audioContext.resume();
        microphoneStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });
        analyser = audioContext.createAnalyser();
        analyser.fftSize = samples.length;
        analyser.smoothingTimeConstant = 0;
        audioContext.createMediaStreamSource(microphoneStream).connect(analyser);
        connectButton.textContent = "マイクを切断";
        connectButton.disabled = false;
        startButton.disabled = false;
        statusDisplay.textContent = "マイク接続済みです。測定したい音の前にスタートしてください。";
        animationFrameId = requestAnimationFrame(readMicrophoneLevel);
      } catch (error) {
        if (microphoneStream) {
          microphoneStream.getTracks().forEach((track) => track.stop());
          microphoneStream = null;
        }
        if (audioContext && audioContext.state !== "closed") {
          await audioContext.close();
          audioContext = null;
        }
        statusDisplay.textContent = showMicrophoneError(error);
        connectButton.disabled = false;
      }
    }

    async function disconnectMicrophone() {
      measuring = false;
      cancelAnimationFrame(animationFrameId);
      microphoneStream.getTracks().forEach((track) => track.stop());
      microphoneStream = null;
      analyser = null;
      startButton.disabled = true;
      connectButton.textContent = "マイクを接続";
      meterLevel.style.width = "0";
      meter.setAttribute("aria-valuenow", "0");

      const contextToClose = audioContext;
      audioContext = null;
      if (contextToClose && contextToClose.state !== "closed") {
        await contextToClose.close();
      }
      statusDisplay.textContent = "マイクを切断しました。";
    }

    function readMicrophoneLevel() {
      analyser.getFloatTimeDomainData(samples);
      let sumOfSquares = 0;
      for (const sample of samples) {
        sumOfSquares += sample * sample;
      }
      const level = Math.sqrt(sumOfSquares / samples.length);
      const meterPercent = Math.min(level * 500, 100);
      meterLevel.style.width = `${meterPercent}%`;
      meter.setAttribute("aria-valuenow", String(Math.round(meterPercent)));

      if (!measuring) {
        const smoothing = level > ambientLevel ? 0.02 : 0.12;
        ambientLevel += (level - ambientLevel) * smoothing;
      } else if (level >= Math.max(detectionThreshold(), ambientLevel * 3)) {
        const elapsedSeconds = (performance.now() - startedAt) / 1000;
        timeDisplay.firstChild.textContent = elapsedSeconds.toFixed(2);
        statusDisplay.textContent = "音を検知しました。もう一度測定できます。";
        measuring = false;
        startButton.disabled = false;
      }

      animationFrameId = requestAnimationFrame(readMicrophoneLevel);
    }

    connectButton.addEventListener("click", async () => {
      if (microphoneStream) {
        try {
          await disconnectMicrophone();
        } catch (error) {
          statusDisplay.textContent = `マイクを切断できませんでした: ${error.message || error.name}`;
        }
        return;
      }
      await connectMicrophone();
    });
    sensitivityInput.addEventListener("input", () => {
      sensitivityValue.value = sensitivityInput.value;
      sensitivityValue.textContent = sensitivityInput.value;
    });

    startButton.addEventListener("click", () => {
      if (!analyser || measuring) {
        return;
      }
      timeDisplay.firstChild.textContent = "--.--";
      startedAt = performance.now();
      measuring = true;
      startButton.disabled = true;
      statusDisplay.textContent = "外部の音を待っています…";
    });
  </script>
</body>
</html>
